name: Catalog and site CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: python -m pip install --requirement requirements-pipeline.txt

      - name: Validate canonical data contract and acceptance bounds
        run: >-
          python scripts/validate_catalog.py
          --require-min-main 150
          --require-max-main 250
          --require-all-categories

      - name: Run offline pipeline regression tests
        run: python -m unittest scripts.test_pipeline

      - name: Verify the licensed PDF manifest
        shell: bash
        run: |
          if [[ -f content/pdf-mirror-manifest.json ]]; then
            python scripts/sync_open_pdfs.py --check-only
          else
            echo "No PDF mirror manifest; all PDFs remain official external links."
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run UI tests
        run: pnpm test

      - name: Build GitHub Pages bundle
        run: pnpm build

      - name: Verify generated README snapshot is committed
        run: git diff --exit-code -- README.md

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - run: python -m pip install --requirement requirements-pipeline.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Validate canonical catalog
        run: >-
          python scripts/validate_catalog.py
          --require-min-main 150
          --require-max-main 250
          --require-all-categories

      - name: Restore verified PDF download cache
        uses: actions/cache@v4
        with:
          path: .cache/pdf-mirrors
          key: pdf-mirrors-${{ hashFiles('content/pdf-mirror-manifest.json') }}
          restore-keys: pdf-mirrors-

      - name: Download verified, redistributable PDFs
        shell: bash
        run: |
          if [[ -f content/pdf-mirror-manifest.json ]]; then
            python scripts/sync_open_pdfs.py
          else
            echo "No PDF mirror manifest; deploying official-link fallbacks only."
          fi

      - name: Build site and deep-link pages
        run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

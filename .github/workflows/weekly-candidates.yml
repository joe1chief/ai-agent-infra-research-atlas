name: Weekly research candidates

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - run: python -m pip install --requirement requirements-pipeline.txt

      - name: Extract report bibliography provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/extract_report_references.py
          https://github.com/joe1chief/awesome-llm-tech-reports
          --max-reports 40
          --output content/candidates/_seed-references.json

      - name: Discover first-party API candidates
        run: >-
          python scripts/discover_candidates.py
          --references content/candidates/_seed-references.json
          --sources arxiv,openreview,mlsys,acl_anthology
          --openreview-title "agent runtime"
          --openreview-title "LLM serving"
          --mlsys-year "$(date -u +%Y)"
          --mlsys-year "$(date -u -d '1 year ago' +%Y)"
          --acl-volume "$(date -u +%Y).acl-demo"
          --acl-volume "$(date -u -d '1 year ago' +%Y).acl-demo"
          --max-results 25
          --write

      - name: Keep canonical catalog valid
        run: python scripts/validate_catalog.py

      - name: Open or update candidate review PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/weekly-research-candidates
          delete-branch: true
          draft: true
          add-paths: content/candidates/*.json
          commit-message: "chore(data): refresh weekly research candidates"
          title: "chore(data): weekly AI and Agent Infra candidates"
          body: |
            Automated discovery only; this PR never publishes candidates.

            Curators must verify infrastructure relevance, merge duplicate versions,
            confirm dates/status, add full bilingual research cards, and move approved
            records into `content/papers/` manually.
